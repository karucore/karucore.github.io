<text x="301" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">(second flop: metastability)</text>
<text x="20" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal">Four such lanes give a raw 4-bit symbol every 256 clocks.</text>
<text x="20" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">Bits are never combined, whitened or XORed, so each lane can be</text>
<text x="20" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">checked against a stochastic model of ring-oscillator jitter.</text>
