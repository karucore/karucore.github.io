<rect x="455" y="248" width="125" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
<text x="517.5" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">pack 4 symbols</text>
<text x="517.5" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">→ 16 bits, FIFO</text>
