<text x="82.5" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">raw symbols</text>
<text x="82.5" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">4 bits / 256 clk</text>
