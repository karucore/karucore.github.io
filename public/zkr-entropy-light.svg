<text x="227.5" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">k = 16 at reset</text>
